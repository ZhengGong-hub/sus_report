# The one canonical run config — every carbontax command reads this file.
# Edit here, then run the stage; no command-line arguments anywhere.
# All parameters are explicit: the code has no hidden defaults, a missing key fails loudly.
# File locations are derived from run_name: everything lives in batch_folder/<run_name>/.

run_name: test_trucost

# ── Shared data locations — files passed between stages ───────────────────────
data:
  input:   # external files made outside this repo
    company_csv: data/input/company.csv  # raw CIQ company-universe export
    trucost_csv: data/input/trucost_environment.csv  # companyid universe for identifier: trucost_companyid
  output:  # produced by the pipeline stages
    intermed_dir: data/output/intermed   # stage-1 state: batch folders of 10 companies each
    pdfs_dir: data/output/sustain_reports_pdfs                                 # downloaded PDFs (<filingId>.pdf)
    mapping_csv: data/output/ciq_filing_mapping/company_esgfiling_mapping.csv  # canonical company↔filing mapping

# ── Stage 1: acquire_pdfs — download PDFs from S&P CIQ ────────────────────────
acquire_pdfs:
  start_date: "2000-01-01"
  end_date: "2025-01-01"
  resume_from: 0          # skip the first N intermed batch folders
  init_folders: false     # true = (re)create intermed batch folders from company_csv, then stop

# ── Stage 2: prepare_batch_input — PDFs → chunks → batch JSONL (local only) ───
prepare_batch_input:
  identifier: trucost_companyid   # "fileid" or "companyid"; empty/omitted companyid list = all companyids or "trucost_companyid"
  model: gpt-5.4-nano       # stamped into the ref parquet and every batch request
  temperature: 0         # request temperature; null = omit (gpt-5-mini rejects any non-default value)
  max_chunks_per_file: null     # cap per filing; null = no cap
  chunk_selection: random     # head | random — how to pick when a filing exceeds max_chunks_per_file
  chunk_sample_seed: 42       # RNG seed for chunk_selection: random (reproducible draw)
  input_price_per_1m_usd: 0.375  # $/1M input tokens (batch-discounted rate); used for the batch cost estimate
  min_page_tokens: 200         # drop pages with fewer tokens before chunking
  chunk_max_tokens: 950       # splitter window size
  chunk_overlap_tokens: 50   # splitter overlap between consecutive chunks
  chunk_workers: 8           # parallel processes for PDF chunking (CPU-bound; raise toward core count)
  # batch-input sharding: OpenAI caps one batch at 50k requests AND ~200MB per input file,
  # so prepare writes an indexed batch_files/ folder, rolling shards at whichever cap hits first
  max_requests_per_shard: 20000    # headroom under the 50k-request cap
  max_bytes_per_shard: 100_000_000   # 180 MiB, headroom under the ~200MB file cap
  max_tokens_per_shard: 10_000_000   # headroom under OpenAI's 20M enqueued-token cap (usually the binding one)
  filter_keywords:            # a chunk must contain at least one (case-insensitive)
    - carbon
    - emission
    - renewable
    - solar
    - wind turbine
    - wind power
    - energy efficiency

# ── Stage 3: openai_batch — submit → status → download → parse ────────────────
# The batch JSONL already carries the model and schema; batch ids and file
# locations are tracked in batch_folder/<run_name>/batch_status.db.
openai_batch:
  submit_wait_seconds: 100   # pause between shard submissions (throttle under the enqueued-token cap)
  # true = preview mode: download/parse/report use only the COMPLETED shards and write *__preview files
  # (aggregated_output_batch_results__preview.csv, parsed_aggregated_batch_output__preview.csv, report__preview.xlsx), never touching the canonical
  # artifacts. A biased subset — shards are contiguous filingId blocks, not a random sample — for peeking only.
  allow_partial: False

# ── Stage 4: analysis — parsed CSV → review workbook ──────────────────────────
# (per-bucket sheets, governance, adoption/coverage/accuracy stats, raw dump)
# No tunable settings: reads  batch_folder/<run_name>/parsed_aggregated_batch_output.csv,
#                      writes batch_folder/<run_name>/report.xlsx.
analysis: {}

# ── Stage 5: regression — chunk flags → company-year panel → regressions ──────
regression:
  panel:
    # mapping fileType to keep. One genre only: a company-year otherwise mixes a
    # Sustainability Report with CSR/Environmental/TCFD documents (29.7% of cells),
    # which multiplies that firm-year's sampling exposure.
    file_type: Sustainability Report
    # which date puts a filing in a year: periodDate = period the report covers,
    # filingDate = when it was published. They differ for 16% of filings.
    year_from: periodDate
    # backward-looking pooling windows in years, inclusive of the anchor year: 1 = that
    # year's report alone, 3 = the anchor year plus the two before it. One panel row per
    # (company, year, window); wider windows trade measurement noise for less within-firm
    # switching, so keep 1 alongside them as the comparison.
    windows: [1, 2, 3]
    # which Trucost date the outcome merge joins on. fiscalyear is Trucost's own period
    # assignment and is right for non-December year ends (a period ending 2021-01-01 is
    # FY2020); periodenddate takes the calendar year of the period end, which misdates
    # those 250 rows and collapses two adjacent fiscal years into one cell.
    trucost_year_from: fiscalyear
    # a Trucost outcome counts as the firm's own number (<scope>_disclosed = true) when its
    # score is <= this. Score scale, undocumented by WRDS and read off the score × disclosure-
    # text crosstab:
    #   1.0 / 2.0  the firm's disclosure (CDP, CSR/environmental report, annual report)
    #   2.4        partial disclosure, or extrapolated from the prior year
    #   3.0        Trucost model from physical intensity factors (S3 downstream only)
    #   4.0        Trucost model from revenue intensity factors, or disclosure rejected
    # 2.4 keeps extrapolated-from-prior-year; 2.0 is the strict cut. The raw score columns
    # stay in the panel either way, so this only names the default rule.
    # NOTE (2026-08-23, supervisor): the headline now runs on all data, so this no longer
    # restricts the sample — it only writes the <scope>_disclosed labels, and the sample cut
    # is made by regression.specs.disclosed_only below. Left at 2.4 on purpose: the label has
    # to keep meaning "the firm's own number" for the disclosed_only=true robustness spec, and
    # raising it toward 4.0 would just rename Trucost's own model as disclosure.
    disclosed_max_score: 2.4

    # denominator for every <flag>_share (the _any dummies are unaffected):
    #   all_chunks     — every chunk the report split into, keyword-matched or not
    #   keyword_chunks — only the chunks sent to the LLM (the original behaviour)
    # keyword_chunks is endogenous to the treatment: prepare_batch_input.filter_keywords
    # contains "renewable", "solar", "wind power", "energy efficiency", so a firm doing more
    # of those matches more chunks, inflating its own denominator and deflating every _share.
    # Measured on this run: a firm-year where tier1_S2_any fires has 2.6x the kept chunks, and
    # +0.38 log points even within firm. Keyword retention is 38% on average but ranges 8-87%
    # across filings, so this is a reweighting, not a rescaling that firm FE would absorb.
    # Note all_chunks counts chunks from pages that cleared min_page_tokens — all chunks, not
    # all text — and needs n_chunks_total in the stage-2 ref parquet (re-run chunking if absent).
    share_denominator: all_chunks

  # ── stage 5b: the regression grid ───────────────────────────────────────────
  # every combination below is estimated as: ln(y) ~ flags + controls + firm FE + year FE.
  # Results land in regression/results.csv (one row per spec × term); the first entry of
  # each list defines the headline spec written to regression/summary.md.
  specs:
    # S2M (market-based) is the primary Scope 2 outcome: it is the one contracted renewables
    # can actually move, and it is 99.9% firm-disclosed. S2L (location-based) is kept as the
    # placebo — a PPA cannot shift it by construction, so a null there is the correct result.
    # S3U is included but expect nothing: 89% of it is Trucost's revenue model — and with
    # disclosed_only=false leading, those modelled cells are now inside the headline sample.
    scopes: [S1, S2M, S2L, S3U, S3D]
    # intensity = tCO2e per $M revenue; absolute = tCO2e, which adds ln(revenue) as a
    # control instead of forcing its coefficient to -1 the way a ratio outcome does
    outcome_forms: [intensity, absolute]
    windows: [1, 3]
    regressor_forms: [any, share]        # the dummy, or the share of chunks carrying the flag
    # tier1_* pool a whole scope into one dummy, which is noisier to fire but far less
    # sensitive to whether one specific measure happened to land in a sampled chunk
    regressor_sets: [scope_matched, scope_matched_plus_gov, tier1, tier1_matched]
    lags: [0]                            # contemporaneous only; add 1, 2 to lag the actions
    # true = drop cells whose y is a Trucost model (score > panel.disclosed_max_score).
    # NOTE (2026-08-23, supervisor): allow all data — false leads the list, so the headline
    # spec in summary.md is now estimated on every company-year with a positive outcome,
    # modelled or disclosed. true stays second so the firm-disclosed-only version is still
    # estimated and lands in results.csv as the robustness check; flip the order back to
    # [true, false] to make that one the headline again.
    disclosed_only: [false, true]
    controls: [log_n_chunks, n_years]    # sampling exposure, and window history depth
    min_switchers: 30                    # drop a flag identified off fewer firms than this
    cluster: companyid
