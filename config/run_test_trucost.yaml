# The one canonical run config — every carbontax command reads this file.
# Edit here, then run the stage; no command-line arguments anywhere.
# All parameters are explicit: the code has no hidden defaults, a missing key fails loudly.
# File locations are derived from run_name: everything lives in batch_folder/<run_name>/.

run_name: test_trucost

# ── Shared data locations — files passed between stages ───────────────────────
data:
  input:   # external files made outside this repo
    company_csv: data/input/company.csv  # raw CIQ company-universe export
    trucost_csv: data/input/trucost_environment.csv  # companyid universe for identifier: trucost_companyid
  output:  # produced by the pipeline stages
    intermed_dir: data/output/intermed   # stage-1 state: batch folders of 10 companies each
    pdfs_dir: data/output/sustain_reports_pdfs                                 # downloaded PDFs (<filingId>.pdf)
    mapping_csv: data/output/ciq_filing_mapping/company_esgfiling_mapping.csv  # canonical company↔filing mapping

# ── Stage 1: acquire_pdfs — download PDFs from S&P CIQ ────────────────────────
acquire_pdfs:
  start_date: "2000-01-01"
  end_date: "2025-01-01"
  resume_from: 0          # skip the first N intermed batch folders
  init_folders: false     # true = (re)create intermed batch folders from company_csv, then stop

# ── Stage 2: prepare_batch_input — PDFs → chunks → batch JSONL (local only) ───
prepare_batch_input:
  identifier: trucost_companyid   # "fileid" or "companyid"; empty/omitted companyid list = all companyids or "trucost_companyid"
  model: gpt-5.4-nano       # stamped into the ref parquet and every batch request
  temperature: 0         # request temperature; null = omit (gpt-5-mini rejects any non-default value)
  max_chunks_per_file: null     # cap per filing; null = no cap
  chunk_selection: random     # head | random — how to pick when a filing exceeds max_chunks_per_file
  chunk_sample_seed: 42       # RNG seed for chunk_selection: random (reproducible draw)
  input_price_per_1m_usd: 0.375  # $/1M input tokens (batch-discounted rate); used for the batch cost estimate
  min_page_tokens: 200         # drop pages with fewer tokens before chunking
  chunk_max_tokens: 950       # splitter window size
  chunk_overlap_tokens: 50   # splitter overlap between consecutive chunks
  chunk_workers: 8           # parallel processes for PDF chunking (CPU-bound; raise toward core count)
  # batch-input sharding: OpenAI caps one batch at 50k requests AND ~200MB per input file,
  # so prepare writes an indexed batch_files/ folder, rolling shards at whichever cap hits first
  max_requests_per_shard: 20000    # headroom under the 50k-request cap
  max_bytes_per_shard: 100_000_000   # 180 MiB, headroom under the ~200MB file cap
  max_tokens_per_shard: 10_000_000   # headroom under OpenAI's 20M enqueued-token cap (usually the binding one)
  filter_keywords:            # a chunk must contain at least one (case-insensitive)
    - carbon
    - emission
    - renewable
    - solar
    - wind turbine
    - wind power
    - energy efficiency

# ── Stage 3: openai_batch — submit → status → download → parse ────────────────
# The batch JSONL already carries the model and schema; batch ids and file
# locations are tracked in batch_folder/<run_name>/batch_status.db.
openai_batch:
  submit_wait_seconds: 100   # pause between shard submissions (throttle under the enqueued-token cap)
  # true = preview mode: download/parse/report use only the COMPLETED shards and write *__preview files
  # (aggregated_output_batch_results__preview.csv, parsed_aggregated_batch_output__preview.csv, report__preview.xlsx), never touching the canonical
  # artifacts. A biased subset — shards are contiguous filingId blocks, not a random sample — for peeking only.
  allow_partial: False

# ── Stage 4: analysis — parsed CSV → review workbook ──────────────────────────
# (per-bucket sheets, governance, adoption/coverage/accuracy stats, raw dump)
# No tunable settings: reads  batch_folder/<run_name>/parsed_aggregated_batch_output.csv,
#                      writes batch_folder/<run_name>/report.xlsx.
analysis: {}

# ── Stage 5: regression — chunk flags → company-year panel → regressions ──────
regression:
  panel:
    # mapping fileType to keep. One genre only: a company-year otherwise mixes a
    # Sustainability Report with CSR/Environmental/TCFD documents (29.7% of cells),
    # which multiplies that firm-year's sampling exposure.
    file_type: Sustainability Report
    # which date puts a filing in a year: periodDate = period the report covers,
    # filingDate = when it was published. They differ for 16% of filings.
    year_from: periodDate
    # backward-looking pooling windows in years, inclusive of the anchor year: 1 = that
    # year's report alone, 3 = the anchor year plus the two before it. One panel row per
    # (company, year, window); wider windows trade measurement noise for less within-firm
    # switching, so keep 1 alongside them as the comparison.
    windows: [1, 2, 3]
    # A filing is paired with its Trucost row on the DATE, not on a year label: merge_asof the
    # report's periodDate onto the Trucost periodenddate, nearest match within this many days.
    # 86.2% of filings match to the day; 31 days picks up a further 4.7% that are the same fiscal
    # period recorded a few days apart, for 90.9% total. The matched row's own fiscalyear then
    # becomes the filing's year, so the outcome merge on (companyid, year) is exact by construction
    # — there is no second labelling rule that has to agree with Trucost's.
    #
    # Why not label both sides with a year and join on that: where the two rules disagree the
    # outcome lands a full year off, and no lag spec can distinguish that from the lag itself.
    # (Measured: fiscalyear equals the calendar year of periodDate for 99.4% of matched filings,
    # so this moves ~38 filings — a defensibility fix, not a results fix.)
    #
    # The 9.1% that match nothing within tolerance keep the calendar year of year_from, so their
    # chunks still pool into windows, but they carry NO outcome: a cell is only given one when a
    # matched report period vouches for its year (an anchor-year filing that paired, or for a
    # gap-year cell, the firm having paired elsewhere). Without that rule the (companyid, year)
    # merge still reaches a Trucost row for half of them, from a period months away. Costs 534
    # S1 cells, 95.6% -> 92.6% coverage; a missing outcome drops a cell, a wrong one biases it.
    trucost_join_tolerance_days: 31
    # a Trucost outcome counts as the firm's own number (<scope>_disclosed = true) when its
    # score is <= this. Score scale, undocumented by WRDS and read off the score × disclosure-
    # text crosstab:
    #   1.0 / 2.0  the firm's disclosure (CDP, CSR/environmental report, annual report)
    #   2.4        partial disclosure, or extrapolated from the prior year
    #   3.0        Trucost model from physical intensity factors (S3 downstream only)
    #   4.0        Trucost model from revenue intensity factors, or disclosure rejected
    # 2.4 keeps extrapolated-from-prior-year; 2.0 is the strict cut. The raw score columns
    # stay in the panel either way, so this only names the default rule.
    # NOTE (2026-08-23, supervisor): the headline now runs on all data, so this no longer
    # restricts the sample — it only writes the <scope>_disclosed labels, and the sample cut
    # is made by regression.specs.disclosed_only below. Left at 2.4 on purpose: the label has
    # to keep meaning "the firm's own number" for the disclosed_only=true robustness spec, and
    # raising it toward 4.0 would just rename Trucost's own model as disclosure.
    disclosed_max_score: 2.4

    # denominator for every <flag>_share (the _any dummies are unaffected):
    #   all_chunks     — every chunk the report split into, keyword-matched or not
    #   keyword_chunks — only the chunks sent to the LLM (the original behaviour)
    # keyword_chunks is endogenous to the treatment: prepare_batch_input.filter_keywords
    # contains "renewable", "solar", "wind power", "energy efficiency", so a firm doing more
    # of those matches more chunks, inflating its own denominator and deflating every _share.
    # Measured on this run: a firm-year where tier1_S2_any fires has 2.6x the kept chunks, and
    # +0.38 log points even within firm. Keyword retention is 38% on average but ranges 8-87%
    # across filings, so this is a reweighting, not a rescaling that firm FE would absorb.
    # Note all_chunks counts chunks from pages that cleared min_page_tokens — all chunks, not
    # all text — and needs n_chunks_total in the stage-2 ref parquet (re-run chunking if absent).
    share_denominator: all_chunks

  # ── stage 5b: the regression ────────────────────────────────────────────────
  # Two regressions, nothing else: ln(y) ~ 30 tier-2 adoption dummies + controls
  # + firm FE + year FE, estimated with pyfixest and SEs clustered on the firm.
  # The right-hand side is the whole tier-2 taxonomy (every `tier2_<measure>_any`)
  # and is fixed in code — it is the design of the study, not a knob.
  # Results land in regression/results.csv (one row per regression × term).
  specs:
    # Pooling width in years for the REGRESSORS only (the panel carries 1, 2, 3): a cell anchored
    # at year t takes its flags from every report covering t, t-1, t-2. The outcome does not pool
    # — y is still the anchor year's Trucost value. Wider is far better measured: mean
    # corr(flag_t, flag_t-1) is 0.389 at window 1, 0.683 at 2, 0.772 at 3, so most of the
    # year-to-year flicker at window 1 is sampling noise rather than real switching, and that
    # noise attenuates every coefficient toward zero. Keep window 1 as the robustness check.
    window: [1, 3]
    # One regression per column listed here — any numeric panel column works, and the same
    # controls and the same dummies are used for all of them.
    # The two below are Trucost's monetised GHG damage, direct and indirect, and are the same
    # quantity: impact_ratio = absolute / trucost_total_revenue × 100, verified exactly on
    # this panel (median ratio 1.0000). Both 92.6% positive at window=1 → 5,295 rows.
    # NOTE these are dollars of damage, not tCO2e. If Trucost's damage-cost factors are
    # constant per tonne the coefficients read as emission elasticities; a common annual
    # drift in the factors is absorbed by the year FE, a sector-specific one is not.
    outcomes:
      # -- primary: physical tCO2e, firm-disclosed, and they actually move ------------------
      # within-firm sd of ln(y) in brackets — the variation left for the dummies after firm FE
      - intensity_ghg_scope_1                        # S1, 68.9% disclosed [0.545]
      - absolute_ghg_scope_1                         # same, unnormalised
      - intensity_ghg_scope_2_location_based         # S2L, 65.8% disclosed [0.490]
      # S2M/S2L is a built-in falsification pair: a PPA or REC moves the market-based number by
      # construction and CANNOT move the location-based one, so tier2_ppa_any loading on S2M but
      # not S2L is the result we want, and loading on both means we are picking up something else.
      - intensity_ghg_scope_2_market_based           # S2M, 99.8% disclosed but only 1,327 cells
      - intensity_ghg_scope_3_downstream_total       # S3D, 39.6% disclosed [0.934]
      - intensity_ghg_direct_and_first_tier_indirect # Trucost's own S1+tier-1 aggregate
      # NOT S3U: 11.0% disclosed, so ln(S3U) is Trucost's revenue model plus a sector constant
      # and cannot respond to anything a firm does. Excluded on purpose, not overlooked.
      # -- continuity with the earlier runs -------------------------------------------------
      - impact_ratio_ghg_direct_and_indirect_cost    # monetised damage, % of revenue [0.261]
    # true  = y enters as ln(y). Coefficients read as proportional effects, and cells with
    #         y <= 0 drop out of that regression (only that one) because ln needs y > 0.
    # false = y enters in levels. Coefficients are in y's own units, zero cells are kept, and
    #         the fit is driven by the largest firms rather than by proportional change.
    # Neither is a no-op switch: it changes the sample as well as the scale whenever an
    # outcome carries zeros. The two outcomes above have none at window=1, so for them the
    # sample is identical either way and only the units change.
    log_transformation_y: true
    # Which families of adoption dummies to estimate. tier2 = 30 specific measures,
    # tier1 = 5 scope-level buckets, governance = 4 commitment flags. Each family is its own
    # regression (families × outcomes), NOT a shared right-hand side: tier1 and tier2 measure
    # the same thing at different resolutions, so a tier1 bucket sitting next to its own tier2
    # members would be identified off extraction disagreement rather than anything economic.
    regressors: [tier2, tier1, scope_matched, scope_mismatched]
    # scope_matched / scope_mismatched need to know which taxonomy scope each outcome belongs
    # to — the column names carry no scope the code can read. Only outcomes listed here get
    # those two regressions; the placebos and the cross-scope aggregates have no single scope
    # and are skipped for them (they still get tier2 and tier1).
    # This is the falsification pair on the X side, mirroring water/waste on the Y side:
    # scope_matched holds the measures that can physically move this y, scope_mismatched holds
    # every other measure, which cannot. Mismatched performing as well as matched means the
    # flags track a firm characteristic, not an abatement channel.
    outcome_scope:
      intensity_ghg_scope_1: S1                      # 6 S1 measures
      absolute_ghg_scope_1: S1
      intensity_ghg_scope_2_location_based: S2       # 4 S2 measures
      intensity_ghg_scope_2_market_based: S2
      intensity_ghg_scope_3_downstream_total: S3D    # 7 S3D measures
    # How many years the flags lead the outcome: 0 = contemporaneous, 1 = this year's y on last
    # year's report. Each lag is its own regression, and a lag REPLACES the contemporaneous
    # flags rather than joining them. Abatement has a lead time, so a measure disclosed at t
    # should move y at t+1 or t+2, not at t; a lag also rules out this year's emissions driving
    # this year's disclosure. It costs sample: only 65% of cells have a t-1 partner in the panel.
    # At window 3 a lag shifts a 3-year window, so consecutive lags mostly re-use the same
    # reports: corr(flags at lag 0, flags at lag k) is 0.772 at k=1 and 0.559 at k=2 — near
    # duplicates of lag 0, not new information. k=3 is the first fully disjoint past window
    # (corr 0.336, which is just genuine firm persistence) and is the one that cleanly rules
    # out this year's emissions driving this year's report. Hence [0, 3], not [0, 1, 2].
    lags: [0]
    # log_n_chunks is the sampling exposure: a flag can only fire in a chunk we sampled, and
    # P(a flag fires) runs 4.9% -> 22.0% from the shortest to the longest quartile of reports.
    # Firm FE does NOT absorb this — the within-firm correlation between ln(n_chunks) and the
    # number of flags fired is 0.633, barely below the 0.649 raw. Longer reports also come in
    # higher-emitting years (within-firm corr 0.118 with ln y), so leaving it out biases every
    # flag coefficient upward. The controls are lagged with the flags, not with y.
    # Also available: log_revenue (firm size), n_years, n_filings, filed_this_year.
    controls: [log_n_chunks]
    min_switchers: 30                    # drop a flag identified off fewer firms than this
    # null = heteroskedasticity-robust (HC1) instead of clustering. NOTE this assumes a firm's
    # observations are independent once the fixed effects are out, which a panel of repeat
    # observations per firm generally violates — expect understated SEs and more apparent
    # significance. Set back to `companyid` for the defensible version.
    cluster: null
